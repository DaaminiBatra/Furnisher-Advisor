# Render Blueprint: backend web service (Docker). Database is created separately
# so you control its plan; paste its Internal Database URL into DATABASE_URL.
services:
  - type: web
    name: furnisher-advisor-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
